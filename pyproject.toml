[project]
name = "energy-research-workbench"
version = "0.1.0"
description = "面向能源电力数据与 AI 方向的全流程科研工作平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
